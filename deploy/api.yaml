apiVersion: apps/v1
kind: Deployment
metadata:
  name: heartops
  labels: {app: heartops}
spec:
  replicas: 2
  selector:
    matchLabels: {app: heartops}
  template:
    metadata:
      labels: {app: heartops}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: /metrics
    spec:
      containers:
        - name: api
          image: heartops:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: '1', memory: 1Gi}
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          readinessProbe:
            httpGet: {path: /ready, port: 8000}
            initialDelaySeconds: 10
          livenessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: heartops
  labels: {app: heartops}
spec:
  type: LoadBalancer
  selector: {app: heartops}
  ports:
    - port: 80
      targetPort: 8000
